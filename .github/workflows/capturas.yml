name: Capturas de demostración
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/capturar_demo.py
      - .github/workflows/capturas.yml
permissions:
  contents: read
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, dom
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: python -m pip install playwright==1.55.0
      - run: python scripts/capturar_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-demo
          path: docs/screenshots/*.png
          if-no-files-found: error
